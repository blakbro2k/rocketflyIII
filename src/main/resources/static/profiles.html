<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profiles · RocketFlyIII</title><link rel="stylesheet" href="accounts.css">
<script type="module" src="profiles.js"></script></head><body><header>RocketFlyIII</header>
<main class="panel access-page"><a href="/">← Overview</a><h1>Profiles</h1><p id="feedback" role="status"></p>
<h2>Current profile</h2><p id="current"></p>
<div id="management" hidden>
<h2>Existing profiles</h2><div id="profiles"></div>
<h2>Add new profile</h2><form id="add">
<label>Username <input name="username" required pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,63}" autocomplete="off"></label>
<label>Password <input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
<label>Confirm password <input type="password" name="confirm" required autocomplete="new-password"></label>
<label>Role <select name="role" required></select></label><button>Add profile</button></form>
<a href="roles.html">Manage roles</a></div>
</main></body></html>
