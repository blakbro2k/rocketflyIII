<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · RocketFlyIII</title>
  <link rel="stylesheet" href="accounts.css">
  <script type="module" src="account-detail.js"></script>
</head>
<body>
  <header><button id="open-settings" aria-label="Open settings" aria-haspopup="dialog">⚙</button><span class="mark" aria-hidden="true">↗</span> RocketFlyIII</header>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="heading"><h2 id="settings-title">Settings</h2><button type="button" aria-label="Close settings">Close</button></div>
    <label class="month-picker">Reporting month <input type="month" id="budget-month" required></label>
  </dialog>
  <main class="panel account-detail">
    <a href="/">← Overview</a>
    <h1 id="name">Account</h1>
    <p id="period"></p>
    <p id="status" role="status">Loading account activity…</p>
    <section id="report" hidden>
    <h2>Daily balance</h2>
    <figure id="balance"></figure>
    <div class="breakdowns"><section><h3>Expenses by category</h3><div id="expenses"></div></section>
    <section><h3>Expenses by budget</h3><div id="budgets"></div></section>
    <section><h3>Income by category</h3><label><input type="checkbox" id="transfers"> Include incoming transfers as income</label><div id="income"></div></section></div>
    <dl class="transfer-totals">
      <div><dt>Transfer in</dt><dd id="transfer-in"></dd></div>
      <div><dt>Transfer out</dt><dd id="transfer-out"></dd></div>
    </dl>
    <h2>Transactions</h2>
    <p id="transaction-status" role="status"></p>
    <div class="transaction-scroll"><table id="transactions" hidden>
      <thead><tr><th scope="col">Description</th><th scope="col">Amount</th><th scope="col">Running balance</th><th scope="col">Date</th><th scope="col">Source account</th><th scope="col">Destination account</th><th scope="col">Category</th><th scope="col">Budget</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
  </main>
</body>
</html>
