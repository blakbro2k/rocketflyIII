<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · RocketFlyIII</title>
  <link rel="stylesheet" href="accounts.css">
  <script type="module" src="budgets.js"></script>
  <script type="module" src="subscriptions.js?v=4"></script>
  <script type="module" src="accounts.js"></script>
</head>
<body>
  <header><button id="open-settings" aria-label="Open settings" aria-haspopup="dialog">⚙</button><span class="brand"><img src="rocket-mark.svg" alt="">RocketFlyIII</span></header>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="heading"><h2 id="settings-title">Settings</h2><button type="button" aria-label="Close settings">Close</button></div>
    <label class="month-picker">Reporting month <input type="month" id="budget-month" required></label>
  </dialog>
  <main>
    <section class="panel" aria-labelledby="budget-heading">
      <div class="heading">
        <h1 id="budget-heading">Budgets</h1>
        <button type="button" id="budget-refresh" aria-label="Refresh budgets">Refresh</button>
      </div>
      <p id="budget-status" role="status">Loading budgets from Firefly III…</p>
      <ul id="budget-list" tabindex="0" aria-label="Budgets" hidden></ul>
      <div id="budget-navigation" hidden>
        <button type="button" id="budget-prev" aria-controls="budget-list">Previous</button>
        <button type="button" id="budget-next" aria-controls="budget-list">Next</button>
      </div>
    </section>
    <section class="panel" aria-labelledby="account-heading">
      <div class="heading">
        <h2 id="account-heading">Accounts</h2>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <p id="status" role="status">Loading accounts from Firefly III…</p>
      <div id="groups"></div>
      <template id="account-table">
      <table>
        <thead><tr><th scope="col">Account name</th><th scope="col">Current balance</th></tr></thead>
        <tbody></tbody>
      </table>
      </template>
    </section>
    <section class="panel" aria-labelledby="subscription-heading">
      <div class="heading">
        <h2 id="subscription-heading">Subscriptions</h2>
        <button type="button" id="subscription-refresh" aria-label="Refresh subscriptions">Refresh</button>
      </div>
      <p id="subscription-status" role="status">Loading subscriptions from Firefly III…</p>
      <div class="transaction-scroll">
      <table id="subscription-table" aria-label="Firefly III subscriptions" hidden>
        <thead><tr><th scope="col">Subscription name</th><th scope="col">Amount</th><th scope="col">Paid this period</th><th scope="col">Next expected match</th><th scope="col">Repeats</th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </section>
  </main>
</body>
</html>
