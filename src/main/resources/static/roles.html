<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roles · RocketFlyIII</title><link rel="stylesheet" href="accounts.css">
<script type="module" src="settings.js"></script>
<script type="module" src="roles.js"></script></head><body><header><button id="open-settings" aria-label="Open settings" aria-haspopup="dialog">⚙</button><span class="brand"><img src="rocket-mark.svg" alt="">RocketFlyIII</span></header>

<main class="panel access-page"><a href="/">← Overview</a><h1>Roles</h1><p id="feedback" role="status"></p>
<label>Role <select id="roles"></select></label>
<form id="editor"><label>Role name <input id="name" maxlength="80" required></label>
<button id="refresh" type="button">Refresh from Firefly III</button>
<fieldset><legend>View accounts</legend><div id="account"></div></fieldset>
<fieldset><legend>View budgets</legend><div id="budget"></div></fieldset>
<button id="save">Save role</button> <button type="button" id="delete">Delete role</button>
</form><a href="profiles.html">Profiles</a>
