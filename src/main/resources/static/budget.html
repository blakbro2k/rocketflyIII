<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget · RocketFlyIII</title>
  <link rel="stylesheet" href="accounts.css">
  <script type="module" src="budget-detail.js"></script>
</head>
<body>
  <header><button id="open-settings" aria-label="Open settings" aria-haspopup="dialog">⚙</button><span class="mark" aria-hidden="true">↗</span> RocketFlyIII</header>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="heading"><h2 id="settings-title">Settings</h2><button type="button" aria-label="Close settings">Close</button></div>
    <label class="month-picker">Budget month <input type="month" id="budget-month" required></label>
  </dialog>
  <main class="panel budget-detail">
    <a href="/">← Overview</a>
    <h1 id="name">Budget</h1>
    <p id="period"></p>
    <div id="chart" role="status">Loading budget activity…</div>
    <h2>Transactions</h2>
    <p id="transaction-status" role="status"></p>
    <div class="transaction-scroll"><table id="transactions" hidden>
      <thead><tr><th scope="col">Description</th><th scope="col">Amount</th><th scope="col">Running balance</th><th scope="col">Date</th><th scope="col">Source account</th><th scope="col">Destination account</th><th scope="col">Category</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </main>
</body>
</html>
