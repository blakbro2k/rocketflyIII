<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscription · RocketFlyIII</title>
  <link rel="stylesheet" href="accounts.css">
  <script type="module" src="subscription-detail.js?v=2"></script>
</head>
<body>
  <header><button id="open-settings" aria-label="Open settings" aria-haspopup="dialog">⚙</button><span class="brand"><img src="rocket-mark.svg" alt="">RocketFlyIII</span></header>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="heading"><h2 id="settings-title">Settings</h2><button type="button" aria-label="Close settings">Close</button></div>
    <label class="month-picker">Reporting month <input type="month" id="budget-month" required></label>
  </dialog>
  <main class="panel budget-detail">
    <a class="overview-button" href="/">← Overview</a>
    <h1 id="name">Subscription</h1>
    <p id="period"></p>
    <p id="status" role="status">Loading subscription…</p>
    <table id="summary" hidden>
      <caption id="definition"></caption>
      <tbody></tbody>
    </table>
  </main>
</body>
</html>
