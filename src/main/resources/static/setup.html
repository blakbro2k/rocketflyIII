<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrator setup · RocketFlyIII</title><link rel="stylesheet" href="accounts.css">
<script type="module" src="setup.js"></script></head><body><header>RocketFlyIII</header>
<main class="panel access-page"><h1>Administrator setup</h1><p id="feedback" role="status"></p>
<form id="setup">
<label>One-time setup or recovery token <input name="token" type="password" required autocomplete="off"></label>
<label>Admin username <input name="username" required autocomplete="username"></label>
<label>New password <input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
<label>Confirm password <input name="confirm" type="password" required autocomplete="new-password"></label>
<button>Save admin login</button></form><a href="/login">Sign in</a>
</main></body></html>
