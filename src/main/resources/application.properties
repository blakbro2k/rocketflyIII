# Spring Boot Basic Config
spring.application.name=rocketflyiii
spring.main.banner-mode=off

# Firefly III connection
rocketfly.firefly.base-url=${FIREFLY_BASE_URL:}
rocketfly.firefly.api-token=${FIREFLY_API_TOKEN:}

rocketfly.data-dir=${ROCKETFLY_DATA_DIR:./rocketfly-data}
spring.datasource.url=jdbc:h2:file:${rocketfly.data-dir}/profiles
spring.sql.init.mode=always
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
